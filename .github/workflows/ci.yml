name: Entra Monitor CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python, tests, and Docker build
    runs-on: ubuntu-latest

    env:
      TENANT_ID: test-tenant-id
      CLIENT_ID: test-client-id
      CLIENT_SECRET: test-client-secret
      TEAMS_WEBHOOK_URL: https://example.invalid/webhook

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python source
        run: |
          python -m compileall src

      - name: Run tests
        run: |
          PYTHONPATH=src pytest -q src/tests

      - name: Validate Docker Compose config
        run: |
          docker compose config -- quiet

      - name: Build Docker image
        run: |
          docker build -t entra-monitor:test .
