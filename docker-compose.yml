services:
  entra-monitor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: entra-monitor

    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 900 seconds = 15 minutes.
      RUN_INTERVAL_SECONDS: "900"

    volumes:
     #Do not copy state/logs into the image.
     #Do make live state/logs available to the running container.
      # Persist state so processed IDs, baselines, alert history, and suppression
      # memory survive container rebuilds.
      - ./state:/app/state

      # Persist logs outside the container.
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('/app/src/main.py') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
